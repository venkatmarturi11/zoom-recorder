version: '3.8'

services:
  zoom-recorder:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: zoom-tab-recorder
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
      - RECORDING_RESOLUTION=1280x720
      - BROWSER_HEADLESS=false
    volumes:
      - ../data:/app/data
      - ../recordings:/app/recordings
    shm_size: '2gb' # Critical for Chromium memory buffer stability
    ports:
      - "8080:8080"
